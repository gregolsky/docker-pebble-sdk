name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load versions
        run: |
          while IFS='=' read -r k v; do
            case "$k" in
              PEBBLE_TOOL_VERSION|PEBBLE_SDK_VERSION)
                [[ "$v" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]] || { echo "::error::bad $k value: $v"; exit 1; }
                echo "$k=$v" >> "$GITHUB_ENV";;
            esac
          done < versions.env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.2  # buildx/buildkit pins aren't tracked by Dependabot; bump by hand
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Push by digest (no tags yet); the merge job assembles the manifest.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          provenance: false   # no BuildKit attestations: they make per-registry digests differ; signed provenance is attached in the merge job
          build-args: |
            PEBBLE_TOOL_VERSION=${{ env.PEBBLE_TOOL_VERSION }}
            PEBBLE_SDK_VERSION=${{ env.PEBBLE_SDK_VERSION }}
          outputs: |
            type=image,name=ghcr.io/${{ github.repository_owner }}/pebble-sdk,push-by-digest=true,name-canonical=true,push=true
            type=image,name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/pebble-sdk,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest
        env:
          digest: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-amd64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write      # Sigstore signing for build provenance (this job runs no upstream code)
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load versions
        run: |
          while IFS='=' read -r k v; do
            case "$k" in
              PEBBLE_TOOL_VERSION|PEBBLE_SDK_VERSION)
                [[ "$v" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]] || { echo "::error::bad $k value: $v"; exit 1; }
                echo "$k=$v" >> "$GITHUB_ENV";;
            esac
          done < versions.env

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/pebble-sdk
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/pebble-sdk
          tags: |
            type=raw,value=latest
            type=raw,value=pebble-tool-${{ env.PEBBLE_TOOL_VERSION }}
            type=raw,value=sdk-${{ env.PEBBLE_SDK_VERSION }}
            type=raw,value=pebble-tool-${{ env.PEBBLE_TOOL_VERSION }}-sdk-${{ env.PEBBLE_SDK_VERSION }}
          labels: |
            io.pebble.tool.version=${{ env.PEBBLE_TOOL_VERSION }}
            io.pebble.sdk.version=${{ env.PEBBLE_SDK_VERSION }}

      - name: Create multi-arch manifest (GHCR)
        working-directory: /tmp/digests
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map(select(startswith("ghcr.io"))) | map("-t " + .) | join(" ")' \
                <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/%s/pebble-sdk@sha256:%s ' "$REPO_OWNER" *)

      - name: Create multi-arch manifest (Docker Hub)
        working-directory: /tmp/digests
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map(select(startswith("docker.io"))) | map("-t " + .) | join(" ")' \
                <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'docker.io/%s/pebble-sdk@sha256:%s ' "$DOCKERHUB_USERNAME" *)

      - name: Resolve published manifest digests
        id: final
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          META_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          for reg in ghcr docker; do
            case "$reg" in
              ghcr)   ref="ghcr.io/${REPO_OWNER}/pebble-sdk:${META_VERSION}";;
              docker) ref="docker.io/${DOCKERHUB_USERNAME}/pebble-sdk:${META_VERSION}";;
            esac
            d=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::bad digest for $ref: $d"; exit 1; }
            echo "$ref -> $d"
            echo "${reg}=$d" >> "$GITHUB_OUTPUT"
          done

      - name: Attest build provenance (GHCR)
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/pebble-sdk
          subject-digest: ${{ steps.final.outputs.ghcr }}
          push-to-registry: true

      - name: Attest build provenance (Docker Hub)
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: docker.io/${{ vars.DOCKERHUB_USERNAME }}/pebble-sdk
          subject-digest: ${{ steps.final.outputs.docker }}
          push-to-registry: true

  release:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load versions
        run: |
          while IFS='=' read -r k v; do
            case "$k" in
              PEBBLE_TOOL_VERSION|PEBBLE_SDK_VERSION)
                [[ "$v" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]] || { echo "::error::bad $k value: $v"; exit 1; }
                echo "$k=$v" >> "$GITHUB_ENV";;
            esac
          done < versions.env

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          gh release create "$REF_NAME" \
            --title "pebble-tool ${PEBBLE_TOOL_VERSION} / SDK ${PEBBLE_SDK_VERSION}" \
            --notes "## Images

          \`\`\`
          ghcr.io/${REPO_OWNER}/pebble-sdk:pebble-tool-${PEBBLE_TOOL_VERSION}-sdk-${PEBBLE_SDK_VERSION}
          docker.io/${DOCKERHUB_USERNAME}/pebble-sdk:pebble-tool-${PEBBLE_TOOL_VERSION}-sdk-${PEBBLE_SDK_VERSION}
          \`\`\`

          **pebble-tool**: ${PEBBLE_TOOL_VERSION}
          **Pebble SDK**: ${PEBBLE_SDK_VERSION}
          **Platforms**: linux/amd64"
