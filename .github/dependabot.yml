version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7  # skip releases younger than a week (supply-chain buffer)
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    cooldown:
      default-days: 7  # skip releases younger than a week (supply-chain buffer)
      exclude:
        - debian  # Docker Official Image; base-layer security patches shouldn't wait
    schedule:
      interval: weekly
